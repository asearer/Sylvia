version: "3.8"

services:
  sylvia-app:
    build:
      context: .
      dockerfile: apps/sylvia_app/Dockerfile
    container_name: sylvia-app
    ports:
      - "5000:5000"
    depends_on:
      - personality-engine
      - communication
    volumes:
      - ./apps/sylvia_app/src:/app/src
      - ./services:/app/services

  personality-engine:
    build: ./services/personality_engine
    container_name: personality-engine
    ports:
      - "5001:5001"

  playground:
    build: services/playground
    container_name: playground-app
    ports:
      - "5002:5002"
    profiles: ["experimental"]  # only run if you opt-in

  classifier:
    build: services/classifier
    container_name: classifier-app
    ports:
      - "5003:5003"
    environment:
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER}
      - MATRIX_BOT_USER=${MATRIX_BOT_USER}
      - MATRIX_BOT_PASSWORD=${MATRIX_BOT_PASSWORD}
      - MATRIX_ROOM_ID=${MATRIX_ROOM_ID}
    profiles: ["experimental"]  # only run if you opt-in

  communication:
    build: ./services/communication
    container_name: communication
    environment:
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER}
      - MATRIX_BOT_USER=${MATRIX_BOT_USER}
      - MATRIX_BOT_PASSWORD=${MATRIX_BOT_PASSWORD}
      - MATRIX_ROOM_ID=${MATRIX_ROOM_ID}

  dashboard:
    image: jupyter/base-notebook
    container_name: dashboard-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./experiments/dashboards:/home/jovyan/work:ro
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER}
      - MATRIX_BOT_USER=${MATRIX_BOT_USER}
      - MATRIX_BOT_PASSWORD=${MATRIX_BOT_PASSWORD}
      - MATRIX_ROOM_ID=${MATRIX_ROOM_ID}
    command: start-notebook.sh --NotebookApp.token=''
    profiles: ["experimental"]

