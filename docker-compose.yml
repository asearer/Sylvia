version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  agent-core:
    build:
      context: .
      dockerfile: services/agent_core/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./services/agent_core:/app/services/agent_core
      - ./libs:/app/libs

  voice-stt:
    build:
      context: .
      dockerfile: services/voice_stt/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Attempt to use host audio device (Linux only usually)
      # For Mac, this is tricky and might not work without PulseAudio network setup.
      # The code falls back to simulation mode if mic fails.
    volumes:
      - ./services/voice_stt:/app/services/voice_stt
      - ./libs:/app/libs
    devices:
      - "/dev/snd:/dev/snd" # For Linux/Ubuntu host

  voice-tts:
    build:
      context: .
      dockerfile: services/voice_tts/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./services/voice_tts:/app/services/voice_tts
      - ./libs:/app/libs
    devices:
      - "/dev/snd:/dev/snd" # For Linux/Ubuntu host

  avatar-bridge:
    build:
      context: .
      dockerfile: services/avatar_bridge/Dockerfile
    depends_on:
      - redis
    ports:
      - "8765:8765"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./services/avatar_bridge:/app/services/avatar_bridge
      - ./libs:/app/libs

  sylvia-app:
    build:
      context: .
      dockerfile: apps/sylvia_app/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./apps/sylvia_app:/app/apps/sylvia_app
      - ./libs:/app/libs
